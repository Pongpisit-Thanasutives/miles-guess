[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25-edl-edu"
description = "Educational evidential PM2.5 regression models and uncertainty evaluation"
readme = "README.md"
license-files = ["LICENSE"]
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "torch>=2.5.1,<3",
    "numpy>=2.0,<3",
    "scipy>=1.13,<2",
    "pandas>=2.2.2,<3",
    "scikit-learn>=1.4.2,<2",
    "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
optuna = ["optuna==5.0.0"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6", "matplotlib-inline>=0.1.7"]
test = ["pytest>=8", "build>=1.2"]

[project.scripts]
pm25-split = "pm25_edl.split_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["pm25_edl*"]

[tool.setuptools.dynamic]
version = {attr = "pm25_edl.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
